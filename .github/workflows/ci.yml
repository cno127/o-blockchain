# O Blockchain CI — minimal Linux build + unit tests + O functional tests.
#
# History: the previous ci.yml was upstream Bitcoin Core's 8-job matrix
# (macOS native, Windows native/cross, ASan, fuzz). Every job had been red since
# Oct 2025 and Actions was disabled at the repository level, so no commit since
# then has ever been built by CI (issue #24). This file replaces that matrix
# with ONE job that must stay green; extra jobs (sanitizers, more platforms) are
# to be added back one at a time on top of a green baseline.
#
# What runs:
#   1. Configure + build with system Boost/libevent/SQLite (no GUI, no ZMQ).
#   2. ctest: every Boost unit-test suite in test_bitcoin (incl. the O suites
#      registered in src/test/CMakeLists.txt), secp256k1, univalue, util tests.
#   3. The O functional tests via test/functional/test_runner.py --ci.
#   4. Optional (workflow_dispatch input): the full upstream functional suite,
#      non-blocking, to survey which inherited tests the fork currently breaks.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - ARCH-GlobalPaymentsV1
  workflow_dispatch:
    inputs:
      full_functional:
        description: 'Also run the full upstream functional test suite (non-blocking survey)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-build-test:
    name: 'Linux (ubuntu-24.04, gcc, no GUI): build + unit tests + O functional tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 800M
      CCACHE_COMPRESS: '1'
      BUILD_DIR: ${{ github.workspace }}/build
      TEST_RUNNER_TIMEOUT_FACTOR: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkgconf ccache python3 \
            libevent-dev libboost-dev libsqlite3-dev
          echo "--- toolchain ---"
          gcc --version | head -1
          cmake --version | head -1
          ninja --version
          python3 --version
          ccache --version | head -1

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ github.job }}-ccache-

      - name: Configure
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_GUI=OFF \
            -DWITH_ZMQ=OFF \
            -DWITH_USDT=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TESTS=ON \
            -DENABLE_WALLET=ON \
            -DWITH_CCACHE=ON \
            -DWERROR=OFF

      - name: Build
        run: |
          ccache --zero-stats
          # -k 0: keep going after the first failure so ONE run surfaces every
          # compile error in the tree (main has not been built by CI since
          # Oct 2025). Link errors still only appear once everything compiles.
          cmake --build "$BUILD_DIR" -j "$(nproc)" -- -k 0
          echo "--- ccache ---"
          ccache --show-stats

      - name: Save ccache
        # Save even when the build failed: partially compiled objects still
        # shorten the next attempt, which is exactly when it matters most.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ github.job }}-ccache-${{ github.sha }}

      - name: Unit tests (ctest — test_bitcoin suites, secp256k1, univalue, util)
        run: |
          ctest --test-dir "$BUILD_DIR" -j "$(nproc)" --output-on-failure --timeout 1800

      - name: O functional tests (regtest, blocking)
        run: |
          "$BUILD_DIR"/test/functional/test_runner.py \
            --ci --quiet \
            --jobs "$(nproc)" \
            --tmpdirprefix "$RUNNER_TEMP" \
            --combinedlogslen=99999999 \
            --timeout-factor="$TEST_RUNNER_TIMEOUT_FACTOR" \
            feature_o_databases.py \
            feature_o_blockchain_sync.py

      - name: Full upstream functional suite (survey, non-blocking)
        if: github.event_name == 'workflow_dispatch' && inputs.full_functional
        continue-on-error: true
        timeout-minutes: 60
        run: |
          "$BUILD_DIR"/test/functional/test_runner.py \
            --ci --quiet \
            --jobs "$(nproc)" \
            --tmpdirprefix "$RUNNER_TEMP" \
            --combinedlogslen=99999999 \
            --timeout-factor="$TEST_RUNNER_TIMEOUT_FACTOR"

      - name: Upload functional-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test_runner_*/**/test_framework.log
            ${{ runner.temp }}/test_runner_*/**/debug.log
          if-no-files-found: ignore
          retention-days: 7
